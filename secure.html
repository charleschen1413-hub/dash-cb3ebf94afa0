const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},k,u8(CT));return new TextDecoder().decode(pt);}
function show(h){document.getElementById("gate").style.display="none";const o=document.getElementById("out");o.innerHTML=h;
 const r=()=>window.renderMathInElement?renderMathInElement(o,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore"}):setTimeout(r,200);r();}
async function derive(pw){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(SALT),iterations:IT},b,256));}
const b64=a=>btoa(String.fromCharCode(...a));
(async()=>{const s=sessionStorage.getItem(SK);if(s){try{show(await dec(u8(s)));}catch(e){sessionStorage.removeItem(SK);}}})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="解密中…";
 try{const raw=await derive(document.getElementById("pw").value);const h=await dec(raw);sessionStorage.setItem(SK,b64(raw));err.textContent="";show(h);}
 catch(x){err.textContent="密碼錯誤";}};
